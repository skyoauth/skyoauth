[alias]
# Line coverage gate: `cargo coverage` fails if line coverage is below the
# threshold. CI runs the same alias. Requires `cargo-llvm-cov` and the
# `llvm-tools-preview` rustup component. `main.rs` is the process entry
# point (socket binding and signal handling) and is excluded.
#
# CI (job `rust-coverage` in .github/workflows/ci.yml) also runs the
# `#[ignore]`d PostgreSQL tests: it sets SKYOAUTH_IT_DATABASE_URL and runs
# `cargo coverage <its options> -- --include-ignored`. To measure what CI
# measures, do the same; plain `cargo coverage` skips those tests and
# reports lower coverage. Keep `--` out of this alias: cargo appends the
# caller's arguments after it, so they would go to the test binaries.
#
# The conformance scenario package `skyoauth-scenarios` (`tests/`) is
# excluded: the gate measures the workspace's own tests, and scenario
# coverage is informational (docs/testing/conformance-layout.md §1.2, §5
# Q9). Its targets need their environment and are not `#[ignore]`d, so
# without the exclusion a run without a database would fail them.
coverage = "llvm-cov --workspace --exclude skyoauth-scenarios --all-features --ignore-filename-regex main\\.rs --fail-under-lines 85"
