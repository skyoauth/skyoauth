name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether this change needs the build and test jobs. When every
  # changed file is documentation (scripts/ci/docs-only.sh), they are
  # skipped. Manual dispatches, and pushes whose previous tip cannot be
  # fetched, run everything.
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as its merge commit, whose first
          # parent is the tip of the base branch.
          fetch-depth: 2

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) if git fetch -q --depth=1 origin "$BEFORE"; then base=$BEFORE; fi ;;
          esac
          if [ -n "$base" ] && sh scripts/ci/docs-only.sh "$base" HEAD; then
            echo "Only documentation changed; skipping the build and test jobs."
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  # Cross-reference checks for the specifications in docs/: fences, task,
  # ADR and conformance IDs, Mermaid task DAGs, links and anchors. It runs
  # for every change, docs-only ones included, so it does not need
  # `changes`.
  docs-check:
    name: Docs consistency
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check docs
        run: node scripts/ci/docs-check.mjs

      - name: Self-test the checker
        if: success() || failure()
        run: node --test scripts/ci/docs-check.test.mjs

  # Static part of the conformance registry check
  # (docs/testing/conformance-layout.md §3): tests/conformance against tasks
  # §8, design §2 and the layout §2 table, plus fixtures and waivers. Like
  # docs-check it runs for every change, so it does not need `changes`. The
  # full history (fetch-depth: 0, which also fetches origin/main) lets the
  # check confirm that each waiver's commit is on main; --require-history
  # turns a missing history into an error instead of a note. smol-toml comes
  # from the scripts/ci lockfile, installed without lifecycle scripts.
  conformance-registry:
    name: Conformance registry
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/ci/package-lock.json

      - name: Install check dependencies
        working-directory: scripts/ci
        run: npm ci --ignore-scripts

      - name: Check the registry
        run: node scripts/ci/check-conformance-registry.mjs --require-history

      - name: Check the generated registry files
        if: success() || failure()
        run: node scripts/ci/gen-conformance-registry.mjs --check

      - name: Self-test the registry check
        if: success() || failure()
        run: node --test scripts/ci/check-conformance-registry.test.mjs

      - name: Self-test the generator
        if: success() || failure()
        run: node --test scripts/ci/gen-conformance-registry.test.mjs

      # The result reporter (layout §3 "Result join") runs on real artifacts
      # only in `conformance-report`, which code changes alone reach; its
      # self-test runs here so it is tested on every change.
      - name: Self-test the result reporter
        if: success() || failure()
        run: node --test scripts/ci/report-conformance.test.mjs

      # publish-badges.sh against local bare repositories (no network, no
      # git configuration of the runner), with one round of the concurrent
      # publishers' stress test; verify-badges-render.sh against a stub curl
      # (no network).
      - name: Self-test the badge scripts
        if: success() || failure()
        env:
          PUBLISH_BADGES_STRESS_ROUNDS: 1
        run: node --test scripts/ci/publish-badges.test.mjs scripts/ci/verify-badges-render.test.mjs

  rust:
    name: Rust format, lint, test, docs (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # The conformance scenario package is linted and documented above
      # and below but not tested here: its targets need their environment
      # (a database for `pg`) and run in their own `scenarios-*` job
      # (docs/testing/conformance-layout.md §1.2).
      - name: Run tests
        run: cargo test --locked --workspace --exclude skyoauth-scenarios --all-targets --all-features

      - name: Run doctests
        run: cargo test --locked --workspace --exclude skyoauth-scenarios --doc --all-features

      - name: Build docs
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Line coverage gate. The threshold lives in the `coverage` alias in
  # .cargo/config.toml. Reports are uploaded even when the gate fails. The
  # job has read-only access; badge publication is a separate job.
  # The gate measures every workspace test, the `#[ignore]`d PostgreSQL
  # tests included, as `service-nextest` runs them: the job has the same
  # pinned PostgreSQL service container, SKYOAUTH_IT_DATABASE_URL and check
  # step, and the coverage step passes `-- --include-ignored` to the test
  # binaries. That separator and argument are in the step, not the alias:
  # cargo appends the step's own options after the alias text, so an alias
  # ending in `-- --include-ignored` would hand `--locked`, `--json` and
  # `--output-path` to the test binaries. scripts/ci/publish-badges.test.mjs
  # checks that the permissions, URL, service and check step match
  # `service-nextest`, that the step ends in `-- --include-ignored`, and
  # that the alias has no `--` and the same ignore regex as below.
  rust-coverage:
    name: Rust coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Keep in sync with the `coverage` alias in .cargo/config.toml.
      COVERAGE_IGNORE_REGEX: 'main\.rs'
      SKYOAUTH_IT_DATABASE_URL: postgres://skyoauth:skyoauth@localhost:5432/skyoauth
    services:
      postgres:
        # postgres:17 (17.12) pinned by its multi-arch index digest. The
        # same pin is in the `rust-coverage`, `service-nextest` and
        # `scenarios-pg` jobs; bump all three together. Dependabot is not
        # configured for this pin; bump it by hand
        # (docs/testing/conformance-layout.md section 4): take the
        # multi-arch index digest of the new 17.x tag from Docker Hub and
        # change tag and digest together. Docker pulls by digest and
        # ignores the tag, so the check step fails if they disagree or if
        # the jobs' pins differ.
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_USER: skyoauth
          POSTGRES_PASSWORD: skyoauth
          POSTGRES_DB: skyoauth
        ports:
          - 5432:5432
        # Probe over TCP: the image's init-time server listens on the Unix
        # socket only, so a socket probe can report ready before the real
        # server starts.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U skyoauth -d skyoauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    outputs:
      report: ${{ steps.report.outputs.complete }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable llvm-tools-preview

      # Pinned so the cargo-llvm-cov side of the coverage run is
      # reproducible. The JSON report itself comes from llvm-cov in the
      # unpinned stable toolchain installed above, so its format can still
      # change; what protects the badge is that a report the
      # `Check for a complete coverage report` step cannot read fails the
      # publish job (scripts/ci/publish-badges-ci.sh) instead of keeping
      # the old badge.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      # Proves the service container is reachable from the runner with the
      # URL the tests use and is the pinned major version; that every
      # `postgres` service in this file has the same tag@digest pin and the
      # server version matches that tag (catches a tag bumped without its
      # digest, or the reverse, or a pin bumped in one job only); and that
      # the role can create, connect to and drop a database, as tests that
      # create a database each need. The step is identical in
      # `rust-coverage`, `service-nextest` and `scenarios-pg`.
      - name: Check PostgreSQL is reachable
        run: |
          pg_isready -d "$SKYOAUTH_IT_DATABASE_URL" -t 30
          version="$(psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc 'SHOW server_version_num')"
          echo "server_version_num: $version"
          if [ "${version%????}" != 17 ]; then
            echo "::error::Expected PostgreSQL 17, got server_version_num '$version'"
            exit 1
          fi
          workflow=.github/workflows/ci.yml
          services="$(grep -c '^ *postgres: *$' "$workflow" || true)"
          images="$(grep '^ *image: .*postgres' "$workflow" | sed 's/^ *image: *//; s/ *$//')"
          count="$(printf '%s' "$images" | grep -c '' || true)"
          pinned="$(printf '%s' "$images" | grep -cx 'postgres:[0-9][0-9.]*@sha256:[0-9a-f]\{64\}' || true)"
          echo "postgres services in $workflow: $services"
          printf '%s\n' "$images" | sed 's/^/  image: /'
          if [ "$services" -eq 0 ] || [ "$count" != "$services" ] || [ "$pinned" != "$services" ]; then
            echo "::error::Each of the $services postgres services in $workflow needs an image 'postgres:<tag>@sha256:<digest>'; $pinned of $count postgres image lines have that form"
            exit 1
          fi
          pin="$(printf '%s\n' "$images" | sort -u)"
          if [ "$(printf '%s\n' "$pin" | grep -c '')" != 1 ]; then
            echo "::error::The postgres pins in $workflow differ ($(printf '%s\n' "$pin" | paste -sd ' ' -)); every job must use the same tag and digest, bump them together"
            exit 1
          fi
          tag="${pin#postgres:}"
          tag="${tag%%@*}"
          server="$(psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc 'SHOW server_version')"
          server="${server%% *}"
          echo "image tag: $tag, server_version: $server"
          if [ "$tag" != "$server" ]; then
            echo "::error::Image tag '$tag' does not match server_version '$server'; update tag and digest together"
            exit 1
          fi
          db="skyoauth_smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          trap 'psql "$SKYOAUTH_IT_DATABASE_URL" -qc "DROP DATABASE IF EXISTS $db" || echo "::warning::Could not drop $db"' EXIT
          psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -qc "CREATE DATABASE $db"
          current="$(psql "${SKYOAUTH_IT_DATABASE_URL%/*}/$db" -v ON_ERROR_STOP=1 -tAc 'SELECT current_database()')"
          if [ "$current" != "$db" ]; then
            echo "::error::Connected to '$current' instead of the new database '$db'"
            exit 1
          fi
          psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -qc "DROP DATABASE $db"
          trap - EXIT
          echo "The role can create, connect to and drop a database ($db)"

      # `shell: bash` runs with -o pipefail, so a failing gate is not masked
      # by `tee`. `-- --include-ignored` runs the PostgreSQL tests too; a
      # failing one fails the step and marks the report incomplete.
      - name: Check coverage threshold
        shell: bash
        run: |
          mkdir -p target/coverage
          cargo coverage --locked --json --summary-only --output-path target/coverage/coverage.json -- --include-ignored 2>&1 \
            | tee target/coverage/coverage.log

      - name: Export LCOV report
        if: always()
        run: |
          if [ -s target/coverage/coverage.json ]; then
            cargo llvm-cov report --lcov --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --output-path target/coverage/lcov.info
          fi

      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --summary-only --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: warn

      # Tells publish-badges whether there are figures to publish: a
      # coverage report from a run whose tests all passed. That holds when
      # only the threshold was missed, but not when the tests failed.
      - name: Check for a complete coverage report
        id: report
        if: always()
        run: |
          if [ -s target/coverage/coverage.json ] &&
            jq -e '.data[0].totals.lines.percent | type == "number"' target/coverage/coverage.json >/dev/null &&
            ! grep -q '^test result: FAILED' target/coverage/coverage.log; then
            echo complete=true >> "$GITHUB_OUTPUT"
          fi

  # Runs the workspace tests under cargo-nextest with the `ci` profile in
  # .config/nextest.toml (no retries, no fail-fast) and uploads the JUnit
  # report, even when tests fail. nextest does not run doctests; the
  # `rust` job does. The artifact name carries the run attempt so a
  # re-run never replaces an earlier attempt's report. DB-backed tests
  # reach the same pinned PostgreSQL service container as `scenarios-pg`
  # and `rust-coverage` through SKYOAUTH_IT_DATABASE_URL; the official
  # image's user is a superuser, so tests can create a database each (the
  # check step proves it). No test filter: every workspace test runs here
  # except the conformance scenario package, whose tests run in the
  # `scenarios-*` jobs (docs/testing/conformance-layout.md §1.2).
  service-nextest:
    name: Service tests (nextest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SKYOAUTH_IT_DATABASE_URL: postgres://skyoauth:skyoauth@localhost:5432/skyoauth
    services:
      postgres:
        # postgres:17 (17.12) pinned by its multi-arch index digest. The
        # same pin is in the `rust-coverage`, `service-nextest` and
        # `scenarios-pg` jobs; bump all three together. Dependabot is not
        # configured for this pin; bump it by hand
        # (docs/testing/conformance-layout.md section 4): take the
        # multi-arch index digest of the new 17.x tag from Docker Hub and
        # change tag and digest together. Docker pulls by digest and
        # ignores the tag, so the check step fails if they disagree or if
        # the jobs' pins differ.
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_USER: skyoauth
          POSTGRES_PASSWORD: skyoauth
          POSTGRES_DB: skyoauth
        ports:
          - 5432:5432
        # Probe over TCP: the image's init-time server listens on the Unix
        # socket only, so a socket probe can report ready before the real
        # server starts.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U skyoauth -d skyoauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151

      # Proves the service container is reachable from the runner with the
      # URL the tests use and is the pinned major version; that every
      # `postgres` service in this file has the same tag@digest pin and the
      # server version matches that tag (catches a tag bumped without its
      # digest, or the reverse, or a pin bumped in one job only); and that
      # the role can create, connect to and drop a database, as tests that
      # create a database each need. The step is identical in
      # `rust-coverage`, `service-nextest` and `scenarios-pg`.
      - name: Check PostgreSQL is reachable
        run: |
          pg_isready -d "$SKYOAUTH_IT_DATABASE_URL" -t 30
          version="$(psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc 'SHOW server_version_num')"
          echo "server_version_num: $version"
          if [ "${version%????}" != 17 ]; then
            echo "::error::Expected PostgreSQL 17, got server_version_num '$version'"
            exit 1
          fi
          workflow=.github/workflows/ci.yml
          services="$(grep -c '^ *postgres: *$' "$workflow" || true)"
          images="$(grep '^ *image: .*postgres' "$workflow" | sed 's/^ *image: *//; s/ *$//')"
          count="$(printf '%s' "$images" | grep -c '' || true)"
          pinned="$(printf '%s' "$images" | grep -cx 'postgres:[0-9][0-9.]*@sha256:[0-9a-f]\{64\}' || true)"
          echo "postgres services in $workflow: $services"
          printf '%s\n' "$images" | sed 's/^/  image: /'
          if [ "$services" -eq 0 ] || [ "$count" != "$services" ] || [ "$pinned" != "$services" ]; then
            echo "::error::Each of the $services postgres services in $workflow needs an image 'postgres:<tag>@sha256:<digest>'; $pinned of $count postgres image lines have that form"
            exit 1
          fi
          pin="$(printf '%s\n' "$images" | sort -u)"
          if [ "$(printf '%s\n' "$pin" | grep -c '')" != 1 ]; then
            echo "::error::The postgres pins in $workflow differ ($(printf '%s\n' "$pin" | paste -sd ' ' -)); every job must use the same tag and digest, bump them together"
            exit 1
          fi
          tag="${pin#postgres:}"
          tag="${tag%%@*}"
          server="$(psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc 'SHOW server_version')"
          server="${server%% *}"
          echo "image tag: $tag, server_version: $server"
          if [ "$tag" != "$server" ]; then
            echo "::error::Image tag '$tag' does not match server_version '$server'; update tag and digest together"
            exit 1
          fi
          db="skyoauth_smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          trap 'psql "$SKYOAUTH_IT_DATABASE_URL" -qc "DROP DATABASE IF EXISTS $db" || echo "::warning::Could not drop $db"' EXIT
          psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -qc "CREATE DATABASE $db"
          current="$(psql "${SKYOAUTH_IT_DATABASE_URL%/*}/$db" -v ON_ERROR_STOP=1 -tAc 'SELECT current_database()')"
          if [ "$current" != "$db" ]; then
            echo "::error::Connected to '$current' instead of the new database '$db'"
            exit 1
          fi
          psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -qc "DROP DATABASE $db"
          trap - EXIT
          echo "The role can create, connect to and drop a database ($db)"

      - name: Run tests
        run: cargo nextest run --locked --workspace --exclude skyoauth-scenarios --all-features --profile ci --run-ignored all

      # The local transport tests that need root and a second local user
      # (`SKYOAUTH_IT_PEER_USER`: the cross-UID peer check, the bind for
      # another UID, the swap and rename races, the unlistable directory).
      # The run above is not root, so those tests print a notice and pass
      # there; this run gives them the user and root, through the runner's
      # passwordless sudo (the step fails if there is none). Output is not
      # captured, so a notice a test prints is in the log: the step fails
      # on any notice that says the peer user is missing, and shows every
      # other notice (a user namespace the runner denied, a bind without
      # /proc not tested) as a warning annotation and in the job summary.
      - name: Run the root-only local transport tests
        run: |
          set -euo pipefail
          sudo -n true || { echo "::error::This runner has no passwordless sudo; the root-only local transport tests cannot run"; exit 1; }
          peer=skyoauth-peer
          sudo useradd --no-create-home --shell /usr/sbin/nologin "$peer"
          log="$RUNNER_TEMP/local-transport-root.log"
          status=0
          sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_TERM_COLOR=$CARGO_TERM_COLOR" "SKYOAUTH_IT_DATABASE_URL=$SKYOAUTH_IT_DATABASE_URL" "SKYOAUTH_IT_PEER_USER=$peer" \
            cargo nextest run --locked -p skyoauth-service --test local_transport --all-features --profile ci-root --run-ignored all --no-capture \
            2>&1 | tee "$log" || status=$?
          # The files the root run wrote belong to root; give them back.
          sudo chown -R "$(id -u):$(id -g)" target
          notices="$(grep -a 'NOTICE:' "$log" | sort -u || true)"
          {
            echo "### Root-only local transport tests"
            grep -a 'tests run:' "$log" | tail -1 | sed 's/^ *//' || true
            if [ -n "$notices" ]; then
              echo "Notices printed by tests (a test that could not run its check):"
              printf '%s\n' "$notices" | sed 's/^/- /'
            else
              echo "No test printed a notice: every root-only check ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$notices" ]; then
            printf '%s\n' "$notices" | while IFS= read -r line; do echo "::warning::$line"; done
          fi
          if printf '%s\n' "$notices" | grep -q 'SKYOAUTH_IT_PEER_USER'; then
            echo "::error::A test printed a notice about SKYOAUTH_IT_PEER_USER although the step sets it to $peer: the root-only checks did not run"
            exit 1
          fi
          exit "$status"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-nextest-junit-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci-root/junit.xml
          if-no-files-found: warn

  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the `rust-version` toolchain from Cargo.toml
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"

      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features

  # The release build's guard for `test-support`, the feature that exposes
  # the ungated registry and trust writers to tests
  # (scripts/ci/check-release-features.mjs): the feature resolution of a
  # release build of each binary package, and of the workspace, turns it
  # on for no package; no workspace feature but `test-support` itself turns
  # it on; and no release command in the workflows, scripts or cargo
  # configuration (aliases expanded, profiles followed) uses --all-features
  # or --all-targets, names it or such a feature, or builds test targets.
  # `cargo tree` and `cargo metadata` build nothing. The self-test runs the
  # guard on small path-only workspaces, offline, with the feature
  # injected each way it could reach a release build. smol-toml (profiles,
  # aliases) comes from the scripts/ci lockfile, installed without
  # lifecycle scripts.
  release-features:
    name: Release build features
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/ci/package-lock.json

      - name: Install check dependencies
        working-directory: scripts/ci
        run: npm ci --ignore-scripts

      - name: Check the release feature resolution
        run: node scripts/ci/check-release-features.mjs

      - name: Self-test the guard
        if: success() || failure()
        run: node --test scripts/ci/check-release-features.test.mjs

  # Conformance scenarios on PostgreSQL: env `pg`, leg string
  # `scenarios-pg/x86_64` (docs/testing/conformance-layout.md §1.1). Tests
  # reach the database through SKYOAUTH_IT_DATABASE_URL (§1.2); the
  # official image's user is a superuser, so tests can create template
  # databases. The job runs the `pg` target of the scenario package
  # `skyoauth-scenarios` (`tests/`, §1.2), whose tests are named by the
  # Rust convention of §3 (`a<NN>_<pos|neg>_…`, module-qualified) and are
  # never `#[ignore]`d: they fail without the database. The nextest `ci`
  # profile has retries = 0 and writes JUnit to target/nextest/ci/junit.xml.
  # An empty selection fails the run (nextest's default `--no-tests=fail`).
  # The job also runs the resolution part of the registry check (§3), which
  # needs the built test list.
  scenarios-pg:
    name: Scenarios (PostgreSQL, x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The name of the leg artifact this job uploaded, from the attempt it
    # ran in, or empty when the upload produced none: conformance-report
    # downloads it by this name (layout §3 "Leg artifacts").
    outputs:
      junit-artifact: ${{ steps.junit.outputs.artifact-id && format('junit-scenarios-pg-x86_64-attempt-{0}', github.run_attempt) || '' }}
    env:
      SKYOAUTH_CONFORMANCE_LEG: scenarios-pg/x86_64
      SKYOAUTH_IT_DATABASE_URL: postgres://skyoauth:skyoauth@localhost:5432/skyoauth
    services:
      postgres:
        # postgres:17 (17.12) pinned by its multi-arch index digest. The
        # same pin is in the `rust-coverage`, `service-nextest` and
        # `scenarios-pg` jobs; bump all three together. Dependabot is not
        # configured for this pin; bump it by hand
        # (docs/testing/conformance-layout.md section 4): take the
        # multi-arch index digest of the new 17.x tag from Docker Hub and
        # change tag and digest together. Docker pulls by digest and
        # ignores the tag, so the check step fails if they disagree or if
        # the jobs' pins differ.
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_USER: skyoauth
          POSTGRES_PASSWORD: skyoauth
          POSTGRES_DB: skyoauth
        ports:
          - 5432:5432
        # Probe over TCP: the image's init-time server listens on the Unix
        # socket only, so a socket probe can report ready before the real
        # server starts.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U skyoauth -d skyoauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151

      # Proves the service container is reachable from the runner with the
      # URL the tests use and is the pinned major version; that every
      # `postgres` service in this file has the same tag@digest pin and the
      # server version matches that tag (catches a tag bumped without its
      # digest, or the reverse, or a pin bumped in one job only); and that
      # the role can create, connect to and drop a database, as tests that
      # create a database each need. The step is identical in
      # `rust-coverage`, `service-nextest` and `scenarios-pg`.
      - name: Check PostgreSQL is reachable
        run: |
          pg_isready -d "$SKYOAUTH_IT_DATABASE_URL" -t 30
          version="$(psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc 'SHOW server_version_num')"
          echo "server_version_num: $version"
          if [ "${version%????}" != 17 ]; then
            echo "::error::Expected PostgreSQL 17, got server_version_num '$version'"
            exit 1
          fi
          workflow=.github/workflows/ci.yml
          services="$(grep -c '^ *postgres: *$' "$workflow" || true)"
          images="$(grep '^ *image: .*postgres' "$workflow" | sed 's/^ *image: *//; s/ *$//')"
          count="$(printf '%s' "$images" | grep -c '' || true)"
          pinned="$(printf '%s' "$images" | grep -cx 'postgres:[0-9][0-9.]*@sha256:[0-9a-f]\{64\}' || true)"
          echo "postgres services in $workflow: $services"
          printf '%s\n' "$images" | sed 's/^/  image: /'
          if [ "$services" -eq 0 ] || [ "$count" != "$services" ] || [ "$pinned" != "$services" ]; then
            echo "::error::Each of the $services postgres services in $workflow needs an image 'postgres:<tag>@sha256:<digest>'; $pinned of $count postgres image lines have that form"
            exit 1
          fi
          pin="$(printf '%s\n' "$images" | sort -u)"
          if [ "$(printf '%s\n' "$pin" | grep -c '')" != 1 ]; then
            echo "::error::The postgres pins in $workflow differ ($(printf '%s\n' "$pin" | paste -sd ' ' -)); every job must use the same tag and digest, bump them together"
            exit 1
          fi
          tag="${pin#postgres:}"
          tag="${tag%%@*}"
          server="$(psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc 'SHOW server_version')"
          server="${server%% *}"
          echo "image tag: $tag, server_version: $server"
          if [ "$tag" != "$server" ]; then
            echo "::error::Image tag '$tag' does not match server_version '$server'; update tag and digest together"
            exit 1
          fi
          db="skyoauth_smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          trap 'psql "$SKYOAUTH_IT_DATABASE_URL" -qc "DROP DATABASE IF EXISTS $db" || echo "::warning::Could not drop $db"' EXIT
          psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -qc "CREATE DATABASE $db"
          current="$(psql "${SKYOAUTH_IT_DATABASE_URL%/*}/$db" -v ON_ERROR_STOP=1 -tAc 'SELECT current_database()')"
          if [ "$current" != "$db" ]; then
            echo "::error::Connected to '$current' instead of the new database '$db'"
            exit 1
          fi
          psql "$SKYOAUTH_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -qc "DROP DATABASE $db"
          trap - EXIT
          echo "The role can create, connect to and drop a database ($db)"

      - name: Run scenario tests
        run: cargo nextest run --locked -p skyoauth-scenarios --test pg --profile ci

      # Runs only after a passing test run. A missing or unreadable report,
      # or one with no test, is an error: the leg would have no evidence.
      - name: Report scenario count
        run: |
          junit=target/nextest/ci/junit.xml
          if [ ! -f "$junit" ]; then
            echo "::error::no JUnit report found at $junit"
            exit 1
          fi
          count="$(sed -n 's/.*<testsuites[^>]* tests="\([0-9]*\)".*/\1/p' "$junit" | head -n 1)"
          if [ -z "$count" ]; then
            echo "::error::cannot read the test count from $junit"
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::no scenario test ran on $SKYOAUTH_CONFORMANCE_LEG"
            exit 1
          fi
          echo "$count scenario tests ran on $SKYOAUTH_CONFORMANCE_LEG." >> "$GITHUB_STEP_SUMMARY"

      # The artifact carries the leg string in `leg` next to the JUnit file,
      # and its name carries the attempt (§3: every attempt is kept). An
      # artifact without a `leg` file needs an entry in NOT_CONFORMANCE in
      # scripts/ci/report-conformance.mjs, or its self-test fails.
      - name: Record the leg
        if: always()
        run: |
          mkdir -p target/nextest/ci
          printf '%s\n' "$SKYOAUTH_CONFORMANCE_LEG" > target/nextest/ci/leg

      - name: Upload JUnit report
        id: junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-scenarios-pg-x86_64-attempt-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci/leg
          if-no-files-found: warn

      # Resolution part of the registry check (layout §3): every test that an
      # implemented stage lists is in the nextest list of its package and
      # target, is not #[ignore]d or filtered out, and comes from the job of
      # one of the stage's legs, each of those jobs with a pos and a neg
      # test; the partial tests that a planned stage lists are checked the
      # same way (resolve, same job, a test of the stage's own entry) but
      # need no pos and neg per job; and every listed scenario-named test
      # (a<NN>_…) is in some stage's tests. Listing needs the build (the test run above made it)
      # but no database. A test of a package missing from the list fails the
      # check, so the list names, with -p, every package that TEST_JOBS in
      # scripts/ci/report-conformance.mjs names, from the PR that adds that
      # package to the workspace (the reporter self-test checks this). One
      # list covers them all until a per-job mode exists (layout §6 "Still
      # open", item 8). The check runs the static part too, so a static
      # failure also fails this job; it runs whatever the tests did, after
      # the leg artifact is uploaded (if: always()), so the leg keeps its
      # artifact. smol-toml comes from the scripts/ci lockfile, installed
      # without lifecycle scripts.
      - uses: actions/setup-node@v7
        if: success() || failure()
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/ci/package-lock.json

      - name: Install check dependencies
        if: success() || failure()
        working-directory: scripts/ci
        run: npm ci --ignore-scripts

      - name: Check that the registered tests exist
        if: success() || failure()
        run: |
          cargo nextest list --locked -p skyoauth-scenarios --profile ci --message-format json > "$RUNNER_TEMP/nextest-list.json"
          node scripts/ci/check-conformance-registry.mjs --nextest-list "$RUNNER_TEMP/nextest-list.json"

  # Informational conformance report: runs scripts/ci/report-conformance.mjs
  # on the leg artifacts of this run (docs/testing/conformance-layout.md §3
  # "Leg artifacts"), appends its Markdown to the step summary and uploads
  # its JSON. It judges this run only, not every run for the commit, and no
  # milestone gate (no --require-milestone, no --require-history), so a
  # stage that is not run or planned never fails it. Only a reporter error
  # fails it: usage, registry or input errors, or a crash; a failed
  # conformance test is a warning here, because it already fails its own
  # leg job (scripts/ci/report-conformance-ci.sh). It is not in `ci-passed`
  # and must not be made a required check. A reporter error still fails the
  # workflow run: on main that turns the README's CI badge red, while
  # `CI passed` stays green.
  #
  # It runs after its leg jobs whatever their result unless the run was
  # cancelled (`!cancelled()`, as in publish-badges): a failed or timed-out
  # leg still gets a report, a cancelled run (such as a pull request run
  # superseded by cancel-in-progress) does not. It does not run when
  # `changes` skipped the code jobs: a docs-only change gets no conformance
  # report and no "not run" summary. `needs` lists every job of this
  # workflow that uploads a leg artifact (`junit-<leg id>-attempt-N`), so all
  # of them have finished before the download; the PR that adds a leg job to
  # ci.yml adds it here, with its `junit-artifact` output, a download step
  # and a DOWNLOADS line (the reporter self-test checks all four). A leg of another
  # workflow (the schedule-only live-wif-negative and nightly legs) runs in
  # another run and cannot be needed here. The reporter binds the registry to the
  # judged commit through the checkout's HEAD, so a pull request run checks
  # out and judges the PR head, as `gh run view` names it in `headSha`
  # (tests/conformance/README.md "The reporter").
  conformance-report:
    name: Conformance report (informational)
    needs:
      - changes
      - scenarios-pg
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/ci/package-lock.json

      - name: Install reporter dependencies
        working-directory: scripts/ci
        run: npm ci --ignore-scripts

      # One download per leg job, by the name that job gave in its
      # `junit-artifact` output: never a pattern (one match extracts flat,
      # several extract into one directory each) and never a name built
      # here (a re-run of this job alone has another run_attempt). A
      # download by name extracts the artifact's files directly into
      # `path`; report-conformance-ci.sh checks them and moves them to
      # ARTIFACTS/<run_id>/<name>/. A leg job that uploaded nothing has an
      # empty output: no download, and its legs are not run. A failed
      # download fails the job before the report step, which has no `if:`.
      # Whether an artifact of an earlier attempt can be downloaded in a
      # re-run is not verified (layout §6 "Still open", item 6).
      - name: Download the scenarios-pg leg artifact
        if: needs.scenarios-pg.outputs.junit-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.scenarios-pg.outputs.junit-artifact }}
          path: ${{ runner.temp }}/conformance-download/scenarios-pg

      - name: Report
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/conformance-download
          DOWNLOADS: |
            scenarios-pg=${{ needs.scenarios-pg.outputs.junit-artifact }}
          ARTIFACTS: ${{ runner.temp }}/conformance-artifacts
          REPORT_JSON: ${{ runner.temp }}/conformance-report.json
        run: sh scripts/ci/report-conformance-ci.sh

      # Not a leg artifact: NOT_CONFORMANCE in the reporter lists it.
      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conformance-report.json
          if-no-files-found: warn

  typescript:
    name: TypeScript lint, test, build (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Coverage gate. The thresholds live in vitest.config.ts. Reports are
  # uploaded even when the gate fails. The job has read-only access; badge
  # publication is a separate job.
  typescript-coverage:
    name: TypeScript coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.report.outputs.complete }}
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - run: npm ci

      - name: Check coverage thresholds
        run: npm run coverage -- --reporter=default --reporter=json --outputFile.json=coverage/test-results.json

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            jq -r '.total | "| Lines | Statements | Functions | Branches |\n|---|---|---|---|\n| \(.lines.pct)% | \(.statements.pct)% | \(.functions.pct)% | \(.branches.pct)% |"' \
              coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typescript-coverage
          path: clients/typescript/coverage/
          if-no-files-found: warn

      # Tells publish-badges whether there are figures to publish: a
      # coverage report from a run whose tests all passed. That holds when
      # only a coverage threshold was missed, but not when tests failed.
      - name: Check for a complete coverage report
        id: report
        if: always()
        run: |
          if [ -s coverage/coverage-summary.json ] &&
            [ -s coverage/test-results.json ] &&
            jq -e '.success == true and .numFailedTests == 0' coverage/test-results.json >/dev/null &&
            jq -e '.total.lines.pct | type == "number"' coverage/coverage-summary.json >/dev/null; then
            echo complete=true >> "$GITHUB_OUTPUT"
          fi

  # Checks that the README still renders the badges already published for
  # main: on every pull request (its merge commit), so a change that drops
  # a badge, or renames one in the README alone, fails before it reaches
  # main, and on a docs-only push to main, which publishes no badges but
  # may have changed the README (other pushes to main check after
  # publishing, in publish-badges). On a pull request (--pull-request),
  # fetch failures it cannot have caused (transport errors, 429 and 5xx
  # after retries; for the rendered README itself, only when the pull
  # request leaves the README unchanged) and a badge not published yet
  # (404, as for one the pull request adds or renames) are warnings; the
  # push to main is strict. Like publish-badges, only in
  # skyoauth/skyoauth: the README embeds that repository's badges, which a
  # fork does not publish.
  verify-badges:
    name: Verify README badges
    needs: changes
    if: >-
      github.repository == 'skyoauth/skyoauth' &&
      (github.event_name == 'pull_request' ||
       (needs.changes.outputs.code == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The merge commit and its first parent (the base tip), which the
      # script compares the README with when the GitHub API is down.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify the README badges render
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- --pull-request
          else
            set --
          fi
          sh scripts/ci/verify-badges-render.sh "$@" "$GITHUB_REPOSITORY" main "$GITHUB_SHA"

  # Publishes the Rust and TypeScript coverage and test-count badges for the
  # pushed branch to the `badges` branch (path `<branch>/`) as SVG files; the
  # README embeds `main/` through github.com, so the badges also render in a
  # private repository and need no external service. A separate job so that
  # only this step, which runs no project code, holds a write-capable token.
  # Runs only for `main`: on pushes to it and on a manual dispatch on it (to
  # republish); a dispatch on any other branch publishes nothing, so no
  # work branch can write to the badges branch.
  # scripts/ci/publish-badges.sh skips figures for a commit that is no
  # longer its branch's tip. Runs on both passing and failing coverage/test
  # jobs: a threshold-only miss publishes the percentage in red (whatever
  # its value: the TypeScript gate also covers branches, functions and
  # statements), and test or build failures publish red `N failed` /
  # `failing` badges so stale passing figures never
  # remain on a red `main`. A docs-only change skips coverage and tests and
  # publishes nothing; the script keeps publishing for a commit that only
  # such changes followed. Only in skyoauth/skyoauth, whose badges the README
  # embeds: a fork would otherwise create a badges branch of its own, and its
  # render check would fail on the README's links to this repository.
  publish-badges:
    name: Publish badges
    if: >-
      !cancelled() &&
      github.repository == 'skyoauth/skyoauth' &&
      (needs.rust-coverage.result != 'skipped' ||
       needs.service-nextest.result != 'skipped' ||
       needs.typescript-coverage.result != 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [rust-coverage, service-nextest, typescript-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: badges-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download Rust coverage report
        if: needs.rust-coverage.outputs.report == 'true'
        uses: actions/download-artifact@v8
        with:
          name: rust-coverage
          path: target/coverage

      - name: Download Rust test report
        if: needs.service-nextest.result != 'skipped'
        continue-on-error: ${{ needs.service-nextest.result != 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: service-nextest-junit-*
          path: target/nextest-artifacts

      - name: Download TypeScript coverage report
        if: needs.typescript-coverage.result != 'skipped'
        continue-on-error: ${{ needs.typescript-coverage.result != 'success' && needs.typescript-coverage.outputs.report != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: typescript-coverage
          path: clients/typescript/coverage

      # scripts/ci/publish-badges-ci.sh turns the needed jobs' results into
      # publish-badges.sh arguments. A job that succeeded without a usable
      # report fails this step, after the badges that are known (red ones
      # included) have been published. A cancelled job counts as failed.
      - name: Publish
        env:
          RUST_COVERAGE_OK: ${{ needs.rust-coverage.outputs.report }}
          RUST_COVERAGE_RESULT: ${{ needs.rust-coverage.result }}
          RUST_TESTS_RESULT: ${{ needs.service-nextest.result }}
          TS_OK: ${{ needs.typescript-coverage.outputs.report }}
          TS_RESULT: ${{ needs.typescript-coverage.result }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: sh scripts/ci/publish-badges-ci.sh

      # Fetches the README as GitHub renders it and checks that it embeds
      # all four badges once each and that GitHub serves the files just
      # published as SVG images.
      - name: Verify the README badges render
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/verify-badges-render.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

  # The one check to require in branch protection. A job skipped for a
  # docs-only change satisfies a required check, except a matrix job: it
  # reports under its unexpanded name, so requiring one would never
  # arrive. This job passes when every job it needs passed or was skipped,
  # except docs-check and conformance-registry: they have no condition, so
  # they must have passed; a skip there would mean they never ran.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - changes
      - docs-check
      - conformance-registry
      - rust
      - rust-coverage
      - service-nextest
      - msrv
      - release-features
      - scenarios-pg
      - typescript
      - typescript-coverage
      - verify-badges
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_CHECK: ${{ needs.docs-check.result }}
          REGISTRY: ${{ needs.conformance-registry.result }}
        run: |
          echo "Job results: $RESULTS"
          if [ "$DOCS_CHECK" != success ]; then
            echo "Docs consistency did not pass: '$DOCS_CHECK'"
            exit 1
          fi
          if [ "$REGISTRY" != success ]; then
            echo "Conformance registry did not pass: '$REGISTRY'"
            exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
