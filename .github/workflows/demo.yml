name: Demo

# Renders the demo walk-through videos (docs/proposals/demo-walkthroughs.md
# §2 and §5, scripts/demo/README.md). No journey exists yet, so it renders
# only the sample transcript, after the renderer's end-to-end test.
#
# A demo failure makes this workflow red and visible, but it must not block
# a merge or a release: only conformance gates a release. This workflow is
# therefore separate from ci.yml and not in `ci-passed`; do not make it a
# required check. The transcript check that does gate merges (secret shapes
# in committed transcripts) is the `demo-transcripts` job of ci.yml.
#
# It publishes nothing outside this run's artifacts: no release assets yet
# (the release job and its open questions are §5), no Pages, no push, no
# comment, no secret. The videos are never committed. When a step fails,
# the raw browser recordings of the failed renders (DEMO_KEEP_RAW) are
# uploaded as a short-lived artifact for diagnosis.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/demo/**
      - tests/demo/**
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Render demo videos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/demo/package-lock.json

      - name: Install demo dependencies
        working-directory: scripts/demo
        run: npm ci --ignore-scripts

      # The Chromium build the pinned playwright expects, with the system
      # libraries it needs.
      - name: Install Chromium for Playwright
        working-directory: scripts/demo
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg if missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1

      # The seeds of every committed test key (--secret-file), as in ci.yml's
      # demo-transcripts job: the check and the render refuse a transcript
      # that shows one. No test key at all fails the step.
      - name: List the test keys
        shell: bash
        run: |
          mapfile -d '' keys < <(find tests/conformance/fixtures -type f -name '*.test-key.json' -print0 | LC_ALL=C sort -z)
          echo "test-key files: ${#keys[@]}"
          if [ "${#keys[@]}" -eq 0 ]; then
            echo "No *.test-key.json under tests/conformance/fixtures: nothing to check the seeds against"
            exit 1
          fi
          for key in "${keys[@]}"; do printf -- '--secret-file\0%s\0' "$key"; done > "$RUNNER_TEMP/demo-secret-files"

      - name: Check the transcripts
        shell: bash
        run: |
          mapfile -d '' secret_files < "$RUNNER_TEMP/demo-secret-files"
          node scripts/demo/transcript.mjs check "${secret_files[@]}" scripts/demo/sample/sample.transcript.jsonl

      - name: End-to-end test of the renderer
        env:
          DEMO_KEEP_RAW: ${{ runner.temp }}/demo-raw
        run: node --test scripts/demo/render.e2e.test.mjs

      - name: Render the sample
        shell: bash
        env:
          DEMO_KEEP_RAW: ${{ runner.temp }}/demo-raw
        run: |
          mapfile -d '' secret_files < "$RUNNER_TEMP/demo-secret-files"
          node scripts/demo/render.mjs scripts/demo/sample/sample.transcript.jsonl --out "$RUNNER_TEMP/demo" "${secret_files[@]}"

      - name: Verify the checksums
        working-directory: ${{ runner.temp }}/demo
        run: sha256sum --strict -c SHA256SUMS

      # Not a conformance leg: NOT_CONFORMANCE in scripts/ci/report-conformance.mjs
      # lists it. 90 days is the most a public repository keeps an artifact
      # (unverified on this repository's settings).
      - name: Upload the videos
        uses: actions/upload-artifact@v7
        with:
          name: demo-videos-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/demo/*.mp4
            ${{ runner.temp }}/demo/*.vtt
            ${{ runner.temp }}/demo/*.transcript.jsonl
            ${{ runner.temp }}/demo/SHA256SUMS
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error

      # The raw recordings of failed renders (render.mjs, DEMO_KEEP_RAW), for
      # diagnosis only; also not a conformance leg (NOT_CONFORMANCE). Absent
      # when the failure came before any render.
      - name: Upload the raw recordings of failed renders
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-raw-recordings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-raw
          retention-days: 3
          if-no-files-found: ignore
