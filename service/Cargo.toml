[package]
name = "skyoauth-service"
version.workspace = true
edition.workspace = true
description = "The skyoauth service."
license-file = "../LICENSE"
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
# The registry's jsonb list columns (`persistence::registry`).
# `float_roundtrip`: a float parses back to the same `f64` it was printed
# from, so a trust source plan's `proof_bounds` text compares equal to the
# stored row at the approval (`operation::source_plan`).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# The audit event hash (identity-registry IR-056), `persistence::registry`.
sha2 = { version = "0.11.1", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
# Exact pin: persistence::migrate calls the `#[doc(hidden)]` `Migrator::run_direct`.
# `json` decodes and binds the registry's jsonb columns.
sqlx = { version = "=0.9.1", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls"] }
# `time`: the bounded wait of the in-transaction parse permit (`trust::keyset`).
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
# `test-support`: the `#[doc(hidden)]` modules `trust::test_support`, which
# exposes the ungated trust writes (`create_version`, `enable_version`,
# `create_source`, `update_source`) to this package's integration tests, and
# `persistence::registry::test_support`, which exposes the bare registry
# trust writers (`create_trust_keyset_version`,
# `update_trust_keyset_version`, `create_trust_source`,
# `update_trust_source`), the operator writers (`create_admin_identity`,
# `create_admin_credential`, `create_admin_role_binding`,
# `update_admin_role_binding`), `append_audit_event` and the operation-row
# writers (`insert_administrative_operation`,
# `consume_administrative_operation`, `revoke_administrative_operation`)
# to those tests and to the scenario tests of `skyoauth-scenarios`. Off in
# a normal build, where those writes are crate-private; the dev-dependency
# on this package below, and the one in `tests/Cargo.toml`, turn it on for
# test targets only (inferred: the mechanism; second-approver proposal,
# "PR 7 as implemented", "PR 9 as implemented" and "PR 10 as
# implemented"). Only a `[dev-dependencies]` entry may name it.
test-support = []

[dev-dependencies]
# This package itself with `test-support`, so its integration tests and
# doctests reach `trust::test_support` and
# `persistence::registry::test_support` under a plain `cargo test`, and so
# does the library's own unit-test build (the `seed` of `trust::keyset`'s
# database tests enrolls its operator through
# `persistence::registry::test_support`). Cargo applies a dev-dependency's
# features only to builds that need dev-dependencies, so `cargo build` and
# `cargo run` leave it off.
skyoauth-service = { path = ".", features = ["test-support"] }
http-body-util = "0.1.5"
# `time` for timeouts that turn a hung database test into a failure.
tokio = { version = "1.54.1", features = ["time"] }
tower = { version = "0.5.3", features = ["util"] }
