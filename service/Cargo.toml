[package]
name = "skyoauth-service"
version.workspace = true
edition.workspace = true
description = "The skyoauth service."
license-file = "../LICENSE"
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
# The registry's jsonb list columns (`persistence::registry`).
# `float_roundtrip`: a float parses back to the same `f64` it was printed
# from, so a trust source plan's `proof_bounds` text compares equal to the
# stored row at the approval (`operation::source_plan`).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# The audit event hash (identity-registry IR-056), `persistence::registry`.
sha2 = { version = "0.11.1", default-features = false }
# Exact pin: persistence::migrate calls the `#[doc(hidden)]` `Migrator::run_direct`.
# `json` decodes and binds the registry's jsonb columns.
sqlx = { version = "=0.9.1", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls"] }
# `time`: the bounded wait of the in-transaction parse permit (`trust::keyset`).
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
# `test-support`: the `#[doc(hidden)]` module `trust::test_support`, which
# exposes the ungated trust writes (`create_version`, `enable_version`,
# `create_source`, `update_source`) to this package's integration tests.
# Off in a normal build, where those writes are crate-private; the
# dev-dependency on this package below turns it on for test targets only
# (inferred: the mechanism; second-approver proposal, "PR 7 as
# implemented").
test-support = []

[dev-dependencies]
# This package itself with `test-support`, so its integration tests and
# doctests reach `trust::test_support` under a plain `cargo test`. Cargo
# applies a dev-dependency's features only to builds that need
# dev-dependencies, so `cargo build` and `cargo run` leave it off.
skyoauth-service = { path = ".", features = ["test-support"] }
http-body-util = "0.1.5"
# `time` for timeouts that turn a hung database test into a failure.
tokio = { version = "1.54.1", features = ["time"] }
tower = { version = "0.5.3", features = ["util"] }
