[package]
name = "skyoauth-service"
version.workspace = true
edition.workspace = true
description = "The skyoauth service."
license-file = "../LICENSE"
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
