[package]
name = "skyoauth-scenarios"
version.workspace = true
edition.workspace = true
description = "Conformance scenario tests of skyoauth (docs/testing/conformance-layout.md)."
license-file = "../LICENSE"
rust-version.workspace = true
publish = false
# The package lives at `tests/`, so Cargo's default test directory would be
# `tests/tests/`. Every target is declared below instead, one per execution
# environment (conformance layout §1.2); a target is added with its first
# test.
autotests = false

# No features (conformance layout §1.2): the `rust`, `msrv` and coverage
# jobs pass `--all-features`, so a feature could not keep environment tests
# out of them. The `rust` job and the `coverage` alias exclude this package
# instead, and the `scenarios-*` jobs run one target each.

[dependencies]
skyoauth-service = { path = "../service" }
# The same exact pin as skyoauth-service, which calls a `#[doc(hidden)]`
# sqlx API; one sqlx version in the workspace.
sqlx = { version = "=0.9.1", default-features = false, features = ["postgres", "runtime-tokio"] }
# `sync` and `time` for the replica harness (src/rep.rs): its barrier and
# deadlines.
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
# The service with `test-support`, for the scenario tests only: they set up
# tenants, audiences, bindings, service identities, grants, keysets and
# their versions, trust sources, operators, audit events and operation rows
# with the bare registry writers, which a normal build keeps crate-private
# (`persistence::registry::test_support`; second-approver proposal, "PR 9
# as implemented" and "PR 10 as implemented"). This turns on a
# feature of a dependency, not one of this package, so it is not what the
# "No features" note above rules out: Cargo applies it only to builds that
# need dev-dependencies, that is, builds of this package's test targets
# (the `scenarios-*` jobs build them with `-p skyoauth-scenarios` and no
# `--features`). Such a build has one copy of the service library, with the
# feature on, and this package's library in `src/` compiles against that
# copy, so a use of `test_support` there would compile in it. `src/` must
# not use it: `service/tests/ungated_writes_private.rs` checks the
# workspace's libraries without test targets, where such a use fails to
# compile, and fails if a normal build turns the feature on.
skyoauth-service = { path = "../service", features = ["test-support"] }
# The A22 and A49 wire tests (`security/a22_wire.rs`, `security/a49_wire.rs`)
# drive the admin router of
# `skyoauth_service::admin_http` with `tower::ServiceExt::oneshot`: the same
# versions as the service's.
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
# The A32 tests sign recovery challenges with test keys, as the workstation
# would: `restore_operator` verifies the Ed25519 signature itself
# (docs/proposals/recovery-verified-response.md). The same version and
# features as the service's.
ed25519-dalek = { version = "3.0.0", default-features = false }
serde_json = "1.0.154"
# `rt-multi-thread` so replica races run in parallel
# (`#[tokio::test(flavor = "multi_thread")]`).
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }

# Environment `pg` (layout §1.1): needs SKYOAUTH_IT_DATABASE_URL. Run by the
# `scenarios-pg` job.
[[test]]
name = "pg"
path = "pg.rs"
